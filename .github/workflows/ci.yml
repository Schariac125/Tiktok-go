name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go modules
        run: |
          go mod tidy && git add go.* &&
          git diff --cached --exit-code ||
            (echo 'Please run "go mod tidy" to sync Go modules' && exit 1)
      - name: Verify gofumpt
        run: |
          echo "refer to https://github.com/mvdan/gofumpt for detailed info" &&
          GO111MODULE=on go install mvdan.cc/gofumpt@v0.4.0 &&
          make fmt && git add pkg cmd &&
          git diff --cached --exit-code ||
            (echo 'Please run "make fmt" to verify fmt' && exit 1)
  
  vet:
    name: vet
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      
      - name: Verify govet
        run: |
          make vet && git add pkg cmd &&
          git diff --cached --exit-code ||
            (echo 'Please run "make vet" to verify govet' && exit 1)
  
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=10m