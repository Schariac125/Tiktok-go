name: tiktok-go

x-service-env: &service-env
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?未设置，请先复制 .env.example 为 .env}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?未设置，请先复制 .env.example 为 .env}
  # OSS 没配也能启动，走到上传接口才会失败，所以允许为空
  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: tiktok-etcd
    restart: unless-stopped
    logging: *service-logging
    ports:
      - "${BIND_ADDR:-127.0.0.1}:2379:2379" # 客户端通信，服务注册与发现
      - "${BIND_ADDR:-127.0.0.1}:2380:2380" # 节点间通信
    command:
      - etcd
      - --name=tiktok-etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: mysql8
    restart: unless-stopped
    logging: *service-logging
    ports:
      - "${BIND_ADDR:-127.0.0.1}:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?未设置，请先复制 .env.example 为 .env}
      MYSQL_DATABASE: tiktok
      TZ: Asia/Shanghai
    command:
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tiktok-redis
    restart: unless-stopped
    logging: *service-logging
    ports:
      - "${BIND_ADDR:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: tiktok-rocketmq-namesrv
    restart: unless-stopped
    logging: *service-logging
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9876:9876"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: tiktok-rocketmq-broker
    restart: unless-stopped
    logging: *service-logging
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:10911:10911" # 客户端连接端口
      - "${BIND_ADDR:-127.0.0.1}:10909:10909" # VIP 通道
      - "${BIND_ADDR:-127.0.0.1}:10912:10912" # 主从同步（当前单机，预留）
    environment:
      ROCKETMQ_BROKER_IP: ${ROCKETMQ_BROKER_IP:?未设置，见 .env.example}
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    volumes:
      - ./deploy/rocketmq/broker.conf:/etc/rocketmq/broker-base.conf:ro
      - rocketmq_store:/home/rocketmq/store
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cp /etc/rocketmq/broker-base.conf /tmp/broker.conf
        echo "brokerIP1=$${ROCKETMQ_BROKER_IP}" >> /tmp/broker.conf
        echo ">>> brokerIP1=$${ROCKETMQ_BROKER_IP}"
        chmod 644 /tmp/broker.conf
        chown -R rocketmq:rocketmq /home/rocketmq/store
        ROCKETMQ_BIN=$(echo /home/rocketmq/rocketmq-*/bin)
        exec su rocketmq -c "sh $${ROCKETMQ_BIN}/mqbroker -c /tmp/broker.conf -n rocketmq-namesrv:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  

  user-rpc:
    build:
      context: .
      dockerfile: app/user/rpc/Dockerfile
    image: tiktok-go/user-rpc:latest
    container_name: tiktok-user-rpc
    restart: unless-stopped
    logging: *service-logging
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/user.yaml:/app/etc/user.yaml:ro
    environment: *service-env
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  video-rpc:
    build:
      context: .
      dockerfile: app/video/rpc/Dockerfile
    image: tiktok-go/video-rpc:latest
    container_name: tiktok-video-rpc
    restart: unless-stopped
    logging: *service-logging
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/video.yaml:/app/etc/video.yaml:ro
    environment: *service-env
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  interaction-rpc:
    build:
      context: .
      dockerfile: app/interaction/rpc/Dockerfile
    image: tiktok-go/interaction-rpc:latest
    container_name: tiktok-interaction-rpc
    restart: unless-stopped
    logging: *service-logging
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 点赞队列走 RocketMQ，broker 没起来这条链路不通
      rocketmq-broker:
        condition: service_healthy
      video-rpc:
        condition: service_healthy
    volumes:
      - ./deploy/interaction.yaml:/app/etc/interaction.yaml:ro
    environment: *service-env
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8082"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  social-rpc:
    build:
      context: .
      dockerfile: app/social/rpc/Dockerfile
    image: tiktok-go/social-rpc:latest
    container_name: tiktok-social-rpc
    restart: unless-stopped
    logging: *service-logging
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 关注/粉丝/好友列表要跨服务取用户名
      user-rpc:
        condition: service_healthy
    volumes:
      - ./deploy/social.yaml:/app/etc/social.yaml:ro
    environment: *service-env
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8083"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: app/gateway/api/Dockerfile
    image: tiktok-go/gateway:latest
    container_name: tiktok-gateway
    restart: unless-stopped
    logging: *service-logging
    ports:
      - "8888:8888"
    # 四个 rpc 都就绪（端口通）后再起，避免启动时 etcd 里还没注册记录
    depends_on:
      user-rpc:
        condition: service_healthy
      video-rpc:
        condition: service_healthy
      interaction-rpc:
        condition: service_healthy
      social-rpc:
        condition: service_healthy
    volumes:
      - ./deploy/gateway.yaml:/app/etc/gateway.yaml:ro
    environment: *service-env
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8888"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  etcd_data:
    name: etcd_data
  mysql_data:
    name: mysql_data
  redis_data:
    name: redis_data
  rocketmq_store:
    name: rocketmq_store
