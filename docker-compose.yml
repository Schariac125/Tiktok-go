# tiktok-go 开发环境的中间件。
#
# 用法：
#   docker compose up -d       启动全部
#   docker compose ps          查看状态（含健康检查）
#   docker compose logs -f     跟踪日志
#   docker compose down        停止并删除容器（数据卷保留）
#
# 约定：
#   - 容器名、卷名都写死了，与之前 docker run 建立的一致，
#     因此已有的 mysql_data、redis_data 会被直接复用，数据不会丢。
#   - 端口与本项目各 etc/*.yaml 里的配置一一对应，改动这里要同步改配置。
#   - MySQL 的 --default-time-zone=+08:00 不能少：库内时间按东八区存，
#     而 DSN 里写的 loc=Asia/Shanghai，两边必须一致，否则读出的时间会差 8 小时。
#   - 密码等私密信息不在本文件里，由同目录的 .env 提供（可复制 .env.example）。

name: tiktok-go

# 各业务服务共用的私密配置，值来自同目录的 .env。
# 用 YAML 锚点复用，省得在 5 个服务里各写一遍；
# 缺变量时 compose 会直接报错，而不是把空密码注进容器。
x-service-env: &service-env
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?未设置，请先复制 .env.example 为 .env}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?未设置，请先复制 .env.example 为 .env}
  # OSS 没配也能启动，走到上传接口才会失败，所以允许为空
  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: tiktok-etcd
    restart: unless-stopped
    ports:
      - "2379:2379" # 客户端通信，服务注册与发现
      - "2380:2380" # 节点间通信
    command:
      - etcd
      - --name=tiktok-etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: mysql8
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?未设置，请先复制 .env.example 为 .env}
      TZ: Asia/Shanghai
    command:
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tiktok-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- RocketMQ ----
  # 点赞队列。NameServer 负责路由，Broker 存消息。
  #
  # brokerIP1 是这套东西上 Docker 最容易踩的坑：broker 会把「客户端该连哪个
  # 地址」注册到 NameServer，而宿主机和容器看到的地址不一样——
  #   宿主机只能走 127.0.0.1 的 published 端口，容器只能走 host.docker.internal。
  # 两者没有公共地址，所以这里注册域名 host.docker.internal：
  #   容器内由 Docker Desktop 解析到网关，宿主机需要在 /etc/hosts 里手动加一行
  #     127.0.0.1 host.docker.internal
  # 两边各自解析到能到宿主机的地址，最终都落到同一个 published 端口。
  # 明文说明见 Makefile 的 rocketmq-hosts 目标。
  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: tiktok-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: tiktok-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "10911:10911" # 客户端连接端口
      - "10909:10909" # VIP 通道
      - "10912:10912" # 主从同步（当前单机，预留）
    environment:
      # 默认 host.docker.internal，见上方说明；改这里可切到别的运行方式
      ROCKETMQ_BROKER_IP: ${ROCKETMQ_BROKER_IP:-host.docker.internal}
      # 镜像默认按机器内存自动推算堆（常见 8g），开发环境给个小值即可。
      # JAVA_OPT_EXT 拼在自动推算的 -Xms/-Xmx 之后，所以这里的值生效。
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    volumes:
      # 不能挂到 /home/rocketmq/conf：该目录在镜像里不存在，Docker 会以 root
      # 建出来，而容器以 uid 3000 运行，写不进去。挂到 /etc 下只读，配置在 /tmp 生成。
      - ./deploy/rocketmq/broker.conf:/etc/rocketmq/broker-base.conf:ro
      - rocketmq_store:/home/rocketmq/store
    # 以 root 启动只为两件事：store 卷由 docker 建出来是 root 属主，需要 chown 给
    # uid 3000；以及写 /tmp 下的配置。做完立刻 su 回 rocketmq 跑 broker，
    # 不让 Java 进程以 root 运行。
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cp /etc/rocketmq/broker-base.conf /tmp/broker.conf
        echo "brokerIP1=$${ROCKETMQ_BROKER_IP}" >> /tmp/broker.conf
        echo ">>> brokerIP1=$${ROCKETMQ_BROKER_IP}"
        chmod 644 /tmp/broker.conf
        chown -R rocketmq:rocketmq /home/rocketmq/store
        ROCKETMQ_BIN=$(echo /home/rocketmq/rocketmq-*/bin)
        exec su rocketmq -c "sh $${ROCKETMQ_BIN}/mqbroker -c /tmp/broker.conf -n rocketmq-namesrv:9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---- 业务服务 ----
  # 配置从 deploy/ 挂载：容器内中间件地址走 compose 服务名，与本地开发的 etc/*.yaml 不同。
  # rpc 服务不对外暴露端口，只经 etcd 服务发现被网关调用。

  user-rpc:
    build:
      context: .
      dockerfile: app/user/rpc/Dockerfile
    image: tiktok-go/user-rpc:latest
    container_name: tiktok-user-rpc
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/user.yaml:/app/etc/user.yaml:ro
    environment: *service-env
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  video-rpc:
    build:
      context: .
      dockerfile: app/video/rpc/Dockerfile
    image: tiktok-go/video-rpc:latest
    container_name: tiktok-video-rpc
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/video.yaml:/app/etc/video.yaml:ro
    environment: *service-env
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  interaction-rpc:
    build:
      context: .
      dockerfile: app/interaction/rpc/Dockerfile
    image: tiktok-go/interaction-rpc:latest
    container_name: tiktok-interaction-rpc
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 点赞队列走 RocketMQ，broker 没起来这条链路不通
      rocketmq-broker:
        condition: service_healthy
      video-rpc:
        condition: service_healthy
    volumes:
      - ./deploy/interaction.yaml:/app/etc/interaction.yaml:ro
    environment: *service-env
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8082"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  social-rpc:
    build:
      context: .
      dockerfile: app/social/rpc/Dockerfile
    image: tiktok-go/social-rpc:latest
    container_name: tiktok-social-rpc
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 关注/粉丝/好友列表要跨服务取用户名
      user-rpc:
        condition: service_healthy
    volumes:
      - ./deploy/social.yaml:/app/etc/social.yaml:ro
    environment: *service-env
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8083"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: app/gateway/api/Dockerfile
    image: tiktok-go/gateway:latest
    container_name: tiktok-gateway
    restart: unless-stopped
    ports:
      - "8888:8888"
    # 四个 rpc 都就绪（端口通）后再起，避免启动时 etcd 里还没注册记录
    depends_on:
      user-rpc:
        condition: service_healthy
      video-rpc:
        condition: service_healthy
      interaction-rpc:
        condition: service_healthy
      social-rpc:
        condition: service_healthy
    volumes:
      - ./deploy/gateway.yaml:/app/etc/gateway.yaml:ro
    environment: *service-env
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8888"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  # 卷由外部创建并持有（docker volume create，见 make infra-up）。
  # 指定固定卷名是为了复用已有的 mysql_data / redis_data，不被加项目名前缀；
  # external 则让 compose 只使用、不管理它们——docker compose down -v 不会误删数据。
  etcd_data:
    name: etcd_data
    external: true
  mysql_data:
    name: mysql_data
    external: true
  redis_data:
    name: redis_data
    external: true
  rocketmq_store:
    name: rocketmq_store
    external: true
