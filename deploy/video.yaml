# 容器内运行用的配置：中间件地址走 compose 的服务名，而非宿主机的 127.0.0.1
Name: video.rpc
ListenOn: 0.0.0.0:8081
Etcd:
  Hosts:
  - etcd:2379
  Key: video.rpc

# 日志：容器只挂了配置文件、没挂日志卷，所以写 stdout 交给 docker 收集。
# 改成 Mode: file 的话日志会落在容器内，docker compose logs 看不到，
# 且容器重建即丢失。
Log:
  Mode: console
  Encoding: json
  Level: info

MySQL:
  DataSource: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/tiktok?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

# model 缓存
CacheRedis:
  - Host: redis:6379
    Type: node
