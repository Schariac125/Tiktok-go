# RocketMQ Broker 静态配置（4.9.x）
#
# 只放与环境无关的部分。brokerIP1 由容器启动脚本从环境变量注入——
# 它必须是「客户端能连上 broker」的那个地址，而宿主机与容器看到的
# 地址不同（宿主机走 127.0.0.1 的 published 端口，容器走
# host.docker.internal），所以不能写死在这个文件里。
# 详见 docker-compose.yml 里 rocketmq-broker 的 command。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 异步刷盘 + 异步复制：开发环境优先吞吐，不追求落盘不丢
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 凌晨 4 点清理过期 commitlog，保留 48 小时
deleteWhen = 04
fileReservedTime = 48

# 开发环境自动建 topic，省去每加一个队列都要 mqadmin updateTopic。
# 生产环境应当关掉并显式建 topic。
autoCreateTopicEnable = true

# 默认 75% 会因 Docker Desktop 虚拟磁盘余量不足而拒绝启动，开发环境放宽
diskMaxUsedSpaceRatio = 95
