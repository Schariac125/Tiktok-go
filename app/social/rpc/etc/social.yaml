Name: social.rpc
ListenOn: 0.0.0.0:8083
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: social.rpc

# 日志：本地开发直接看终端。plain 比默认的 json 好读；
# 级别开到 debug，需要时在代码里加 Debugf 就能看到
Log:
  Mode: console
  Encoding: plain
  Level: debug

MySQL:
  DataSource: root:${MYSQL_ROOT_PASSWORD}@tcp(127.0.0.1:13306)/tiktok?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

# model 缓存
CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node

# 关注/粉丝/好友列表要补齐用户名
UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
