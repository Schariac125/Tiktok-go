Name: user.rpc
ListenOn: 0.0.0.0:8080
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: user.rpc

MySQL:
  DataSource: root:350322@tcp(127.0.0.1:13306)/tiktok?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

# model 缓存
CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node

# token 签发
JWT:
  AccessSecret: "tiktok-go-dev-secret-change-me"
  AccessExpire: 2h
  RefreshExpire: 168h

# 阿里云 OSS（头像等对象存储）
OSS:
  Endpoint: "oss-cn-beijing.aliyuncs.com"
  AccessKeyID: ""
  AccessKeySecret: ""
  BucketName: ""
  Domain: "" # 为空时使用默认公网域名 https://<bucket>.<endpoint>
