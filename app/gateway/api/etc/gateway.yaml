Name: gateway
Host: 0.0.0.0
Port: 8888

# 全局请求体上限，够头像上传（5MB）即可；
# 视频投稿的大文件由 video_auth.api 的 @server(maxBytes) 单独放开
MaxBytes: 8388608 # 8MB

# 日志：本地开发直接看终端。plain 比默认的 json 好读；
# 级别开到 debug，需要时在代码里加 Debugf 就能看到
Log:
  Mode: console
  Encoding: plain
  Level: debug

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc

VideoRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: video.rpc

InteractionRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: interaction.rpc

SocialRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: social.rpc

# 阿里云 OSS（视频、封面等对象存储，投稿时由网关直传）
OSS:
  Endpoint: "oss-cn-beijing.aliyuncs.com"
  AccessKeyID: "${OSS_ACCESS_KEY_ID}"
  AccessKeySecret: "${OSS_ACCESS_KEY_SECRET}"
  BucketName: ""
  Domain: "" # 为空时使用默认公网域名 https://<bucket>.<endpoint>

# 与 user.rpc 共用同一个环境变量，两边天然一致
JWT:
  AccessSecret: "${JWT_ACCESS_SECRET}"
  AccessExpire: 2h
