Name: interaction.rpc
ListenOn: 0.0.0.0:8082
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: interaction.rpc

MySQL:
  DataSource: root:${MYSQL_ROOT_PASSWORD}@tcp(127.0.0.1:13306)/tiktok?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

# model 缓存；点赞队列也走这个 redis
CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node

# 组装点赞列表时要读视频信息
VideoRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: video.rpc
