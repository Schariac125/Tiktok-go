Name: interaction.rpc
ListenOn: 0.0.0.0:8082
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: interaction.rpc

# 日志：本地开发直接看终端。plain 比默认的 json 好读；
# 级别开到 debug，需要时在代码里加 Debugf 就能看到
Log:
  Mode: console
  Encoding: plain
  Level: debug

MySQL:
  DataSource: root:${MYSQL_ROOT_PASSWORD}@tcp(127.0.0.1:13306)/tiktok?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

# model 的单条记录缓存
CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node

# 点赞落库队列。broker 地址由 NameServer 下发，不在这里配
RocketMQ:
  NameServer:
    - 127.0.0.1:9876

# 组装点赞列表时要读视频信息
VideoRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: video.rpc
